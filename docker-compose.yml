services:
  # 1. Eclipse Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    restart: always
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      - MQTT_BACKEND_USER=${MQTT_BACKEND_USER:-backend}
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:?Dat MQTT_BACKEND_PASSWORD trong .env}
      - MQTT_DEVICE_USER=${MQTT_DEVICE_USER:-esp32_01}
      - MQTT_DEVICE_PASSWORD=${MQTT_DEVICE_PASSWORD:?Dat MQTT_DEVICE_PASSWORD trong .env}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot-network

  # 2. MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: iot_mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 })\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 3. Backend Express Server + WebSocket
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iot_server
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:?Dat MONGO_ROOT_PASSWORD trong .env}@mongodb:27017/smart_irrigation?authSource=admin
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USERNAME=${MQTT_BACKEND_USER:-backend}
      - MQTT_PASSWORD=${MQTT_BACKEND_PASSWORD:?Dat MQTT_BACKEND_PASSWORD trong .env}
      - JWT_SECRET=${JWT_SECRET:?Dat JWT_SECRET trong .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Dat ADMIN_PASSWORD trong .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:4001,http://localhost:3001}
      - OFFLINE_AFTER_SEC=30
      - DEFAULT_FLOW_RATE_LPM=2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - iot-network

  # 4. Frontend Next.js UI
  frontend:
    build:
      context: ./reactUI
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: iot_frontend
    restart: always
    ports:
      - "4001:4001"
    environment:
      - INTERNAL_API_URL=http://server:3001
    depends_on:
      server:
        condition: service_healthy
    networks:
      - iot-network

volumes:
  mongodb_data:
  mosquitto_data:
  mosquitto_log:

networks:
  iot-network:
    driver: bridge
