<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <title>AquaSense – Mất kết nối</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at 30% 20%, #d1fae5, #f0f8f2 60%);
        color: #064e3b; padding: 24px;
      }
      .card {
        max-width: 360px; text-align: center; background: rgba(255,255,255,.75);
        backdrop-filter: blur(12px); border: 1px solid #a7f3d0; border-radius: 24px;
        padding: 32px 24px; box-shadow: 0 20px 40px -20px rgba(4,120,87,.35);
      }
      img { width: 72px; height: 72px; border-radius: 18px; animation: float 3s ease-in-out infinite; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #047857; font-size: 14px; line-height: 1.5; }
      button {
        border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 15px;
        color: #fff; background: linear-gradient(135deg, #10b981, #047857); cursor: pointer;
      }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="AquaSense" />
      <h1>Không có kết nối mạng</h1>
      <p>AquaSense cần Internet để lấy dữ liệu cảm biến và điều khiển bơm. Vui lòng kiểm tra kết nối rồi thử lại.</p>
      <button id="retry-btn" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
